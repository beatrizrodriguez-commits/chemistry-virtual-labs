<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chemistry Virtual Labs</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f7fbfe}
body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
}
.page{
  position:relative;
  width:min(100%,1312px);
  line-height:0;
  margin:0 auto;
}
.page img{
  display:block;
  width:100%;
  height:auto;
}
.hotspot{
  position:absolute;
  left:2.7%;
  top:32.2%;
  width:21.3%;
  height:4.5%;
  border-radius:12px;
  text-decoration:none;
  outline:none;
}
.hotspot:focus-visible{
  box-shadow:0 0 0 4px rgba(21,104,203,.55);
}
.sr-only{
  position:absolute!important;
  width:1px!important;
  height:1px!important;
  padding:0!important;
  margin:-1px!important;
  overflow:hidden!important;
  clip:rect(0,0,0,0)!important;
  white-space:nowrap!important;
  border:0!important;
}
</style>
</head>
<body>
<main class="page" aria-label="Chemistry Virtual Labs homepage">
  <img src="chemistry_virtual_labs_homepage.png"
       alt="Chemistry Virtual Labs homepage with twelve food-themed chemistry units. Baking Soda is available; all other units are coming soon.">
  <a class="hotspot"
     href="baking-soda/unknown-substances/"
     aria-label="Open the Baking Soda Unknown Substances Virtual Lab">
    <span class="sr-only">Open Baking Soda Unknown Substances Virtual Lab</span>
  </a>
</main>
</body>
</html>
